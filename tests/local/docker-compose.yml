# Paikallinen testiympäristö: PostgreSQL + PostgREST (sama REST-kerros kuin Supabasessa).
#   docker compose -f tests/local/docker-compose.yml up -d
# REST-rajapinta: http://localhost:54321  (vastaa Supabasen polkua /rest/v1)
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: postgres
    ports:
      - "54322:5432"
    volumes:
      - ./00_supabase_stub.sql:/docker-entrypoint-initdb.d/00_supabase_stub.sql:ro
      - ../../supabase/migrations/20261027000000_pesutupa_init.sql:/docker-entrypoint-initdb.d/10_init.sql:ro
      - ../../supabase/migrations/20261028000000_half_hour_slots.sql:/docker-entrypoint-initdb.d/11_half_hour_slots.sql:ro
      - ../../supabase/migrations/20261028010000_booking_hours.sql:/docker-entrypoint-initdb.d/12_booking_hours.sql:ro
      - ../../supabase/migrations/20261028020000_cancel_any_booking.sql:/docker-entrypoint-initdb.d/13_cancel_any_booking.sql:ro
      - ../../supabase/migrations/20261028030000_extend_half_hour.sql:/docker-entrypoint-initdb.d/14_extend_half_hour.sql:ro
      - ../../supabase/migrations/20261028040000_booking_log.sql:/docker-entrypoint-initdb.d/15_booking_log.sql:ro
      - ../../supabase/migrations/20261028050000_log_hide_device.sql:/docker-entrypoint-initdb.d/16_log_hide_device.sql:ro
      - ./20_seed_password.sql:/docker-entrypoint-initdb.d/20_seed_password.sql:ro
      - ../db:/tests:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      retries: 30

  rest:
    image: postgrest/postgrest:v12.2.8
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://authenticator:authenticator@db:5432/postgres
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_SERVER_PORT: 3000
    ports:
      - "54321:3000"
